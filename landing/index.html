<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentazione AION</title>
  <meta name="description" content="Documentazione ufficiale dei prodotti AION.">
  <style>
    :root {
      --bg: #0b0d12; --panel: #141821; --border: #232a37;
      --text: #e8ecf3; --muted: #9aa4b5; --accent: #5b8cff;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f7fb; --panel: #ffffff; --border: #e2e6ee; --text: #121722; --muted: #5d6677; --accent: #2f5fe0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header { padding: 72px 24px 40px; text-align: center; }
    header h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.8rem); letter-spacing: -0.02em; }
    header p { margin: 0; color: var(--muted); font-size: 1.1rem; }
    main {
      flex: 1; width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px 64px;
      display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-content: start;
    }
    .card {
      display: flex; flex-direction: column; gap: 10px; padding: 24px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card h2 { margin: 0; font-size: 1.25rem; }
    .card p { margin: 0; color: var(--muted); line-height: 1.5; flex: 1; }
    .card .go { color: var(--accent); font-weight: 600; font-size: .95rem; }
    footer { padding: 24px; text-align: center; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Documentazione AION</h1>
    <p>Scegli il prodotto di cui vuoi consultare la documentazione.</p>
  </header>
  <main>
{{CARDS}}
  </main>
  <footer>© {{YEAR}} AION · <a href="https://aion-asa.com" style="color:inherit">aion-asa.com</a></footer>
</body>
</html>
